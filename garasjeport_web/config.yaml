name: Garasjeport Web
version: "2.3.0"
slug: garasjeport_web
description: Nettside med knapp som åpner garasjeporten. Brukerliste og adgangslogg.
url: https://github.com/owanvik/hass-garasjeport-web
arch:
  - amd64
init: false
homeassistant_api: true
# Trengs for at add-onet skal kunne lese og skrive sine egne opsjoner,
# slik at blokkerte IP-er vises og kan fjernes i Configuration.
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Webgrensesnitt (port-forward denne for tilgang utenfra)
options:
  users:
    - username: BYTT-MEG-til-noe-langt
      label: Navn
      enabled: true
      admin: true
  entity_id: button.garasjeport_garasjeport_apne
  cooldown_seconds: 5
  log_max_lines: 5000
  max_failures: 20
  window_hours: 12
  block_hours: 0
  trust_proxy: false
  never_block: []
  blocked_ips: []
  pwa_banner: true
schema:
  users:
    - username: str
      label: str?
      enabled: bool?
      admin: bool?
  entity_id: str
  cooldown_seconds: int(0,300)
  log_max_lines: int(100,100000)
  max_failures: int(1,1000)
  window_hours: int(1,168)
  block_hours: int(0,8760)
  trust_proxy: bool
  never_block:
    - str
  blocked_ips:
    - str
  pwa_banner: bool
